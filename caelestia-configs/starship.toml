# Generated by starship-theme.py from starship.toml.template
# DO NOT EDIT — regenerated on every wallpaper/theme change.

# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
$cmd_duration 󰜥 $directory $git_branch $git_status$fill$time
$character"""

[fill]
symbol = " "

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[  ⚡ ❯](bold fg:#f8b6b7)"
error_symbol = "[  💥 ❯](bold fg:#f97758)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#e6bdbd"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "󰜥 [](bold fg:#e6bdbd)[$symbol $branch(:$remote_branch)](fg:#553939 bg:#e6bdbd)[](bold fg:#e6bdbd)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[🖥 •$hostname](bg:#f8b6b7 bold fg:#613335)[](bold fg:#f8b6b7)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = false
format = '[ ](bold fg:#211717)[󰥔 $time](bold bg:#211717 fg:#e6bdbd)[ ](bold fg:#211717)'
time_format = "%I:%M %p"
utc_time_offset = "local"

[username]
style_user = "bold bg:#f8b6b7 fg:#613335"
style_root = "red bold"
format = "[](bold fg:#f8b6b7)[👋 $user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " 󰋜 "
read_only = "  "
style = "bg:#ffdff5 fg:#6f4868"
truncation_length = 6
truncation_symbol = " ••/"
format = '[](bold fg:#ffdff5)[󰉋 $path]($style)[](bold fg:#ffdff5)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#211717)[⏱ 󰪢 $duration](bold bg:#211717 fg:#e6bdbd)[](bold fg:#211717)'
