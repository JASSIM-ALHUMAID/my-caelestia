# ~/.config/hypr/hyprsunset.conf
#
# UNUSED. Superseded by the shell's HyprSunset service (Nexus > Power & screen > Night light),
# which starts hyprsunset with --identity and drives it over hyprctl. Kept as a reference for
# running hyprsunset standalone.

# Optional: Global max gamma limit
max-gamma = 1.0

# Daylight: Full blue light / Identity (6000K-6500K is standard)
profile {
    time = 08:30
    identity = true
}

# Evening: Start warming up
profile {
    time = 19:30
    temperature = 4500
}

# Late Night: Deep orange for sleep
profile {
    time = 22:30
    temperature = 3500
    gamma = 0.9
}
