# Caelestia shell — user-build env (reference snippet)
#
# Only needed for the USER install (devfiles/install-user.fish). It makes
# `qs -c caelestia` load the locally-built plugin from ~/.local instead of the
# system package's. The install script appends these lines to
# ~/.config/hypr/hyprland/env.conf automatically; this file is just a reference
# you can source or copy from. NOT needed for a system-wide install.
#
# Hyprland does not expand ~ or $HOME in `env =`, so use an absolute path and
# replace <USER> with your username if you copy this by hand.

env = QML2_IMPORT_PATH, /home/<USER>/.local/lib/qt6/qml
env = CAELESTIA_LIB_DIR, /home/<USER>/.local/lib/caelestia
